<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>USMLE Step 1 Daily Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb" id="meta-theme-color">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Step1 Quiz">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #2563eb; --correct: #16a34a; --incorrect: #dc2626; --border: #334155;
  }
  :root[data-theme="light"] {
    --bg: #f8fafc; --panel: #ffffff; --text: #0f172a; --muted: #64748b;
    --accent: #2563eb; --correct: #16a34a; --incorrect: #dc2626; --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; }
  #app { max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 48px; }
  h1 { font-size: 1.3rem; margin: 8px 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .home-btn { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 12px; padding: 16px; margin-bottom: 12px; font-size: 1rem; cursor: pointer; }
  .home-btn:active { background: var(--accent); }
  .home-btn .count { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .progress-bar-fill { height: 100%; background: var(--accent); transition: width 0.2s; }
  .stem { font-size: 1.05rem; line-height: 1.5; margin-bottom: 16px; white-space: pre-wrap; }
  .option { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; font-size: 0.95rem; cursor: pointer; }
  .option.correct { background: rgba(22,163,74,0.25); border-color: var(--correct); }
  .option.incorrect { background: rgba(220,38,38,0.25); border-color: var(--incorrect); }
  .option:disabled { cursor: default; opacity: 0.9; }
  .explanation { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-top: 4px; margin-bottom: 8px; font-size: 0.9rem; }
  .explanation.correct-exp { border-color: var(--correct); }
  .explanation.incorrect-exp { border-color: var(--incorrect); opacity: 0.85; }
  .btn-primary { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: var(--accent); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 12px; }
  .btn-secondary { display: block; width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
    background: transparent; color: var(--text); font-size: 0.95rem; cursor: pointer; margin-top: 8px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .back-link { color: var(--muted); text-decoration: none; font-size: 0.9rem; background: none; border: none; cursor: pointer; }
  .star-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted); }
  .star-btn.active { color: #facc15; }
  .empty-state { color: var(--muted); text-align: center; padding: 32px 16px; }
  .theme-toggle { position: fixed; top: 12px; right: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 50%; width: 40px; height: 40px; font-size: 1.1rem; cursor: pointer; z-index: 10; }
  .filter-input { display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel); color: var(--text); font-size: 0.95rem; margin-bottom: 12px; }
  .filter-input::placeholder { color: var(--muted); }
  .list-item { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 0.85rem; cursor: pointer; }
  .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .section-title { font-size: 1.05rem; margin: 20px 0 8px; }
</style>
</head>
<body>
<button id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark theme">🌙</button>
<div id="app"></div>
<script>
'use strict';

const LS_KEYS = {
  progress: 'usmle_progress_v1',
  history: 'usmle_history_v1',
  wrongBank: 'usmle_wrong_bank_v1',
  bookmarks: 'usmle_bookmarks_v1',
  theme: 'usmle_theme_v1',
};

const SUBJECTS = [
  'Cardiology', 'Dermatology', 'Endocrinology', 'Gastroenterology', 'Genetics',
  'Hematology', 'Immunology', 'Musculoskeletal', 'Neurology', 'Ophthalmology',
  'Pathology', 'Psychiatry', 'Pulmonary', 'Renal', 'Reproductive',
];

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function dateStrFor(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function todayStr() {
  return dateStrFor(new Date());
}

async function fetchDailyQuestions() {
  const res = await fetch(`questions.json?v=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Failed to load questions.json: ${res.status}`);
  return res.json();
}

function getProgress() {
  const p = loadJSON(LS_KEYS.progress, null);
  if (p && p.date === todayStr()) return p;
  return null;
}

function saveProgress(progress) {
  saveJSON(LS_KEYS.progress, progress);
}

function getHistory() {
  return loadJSON(LS_KEYS.history, []);
}

function addHistoryEntry(entry) {
  const history = getHistory();
  history.push(entry);
  saveJSON(LS_KEYS.history, history.slice(-365));
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- theme ---
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-toggle').textContent = theme === 'light' ? '🌙' : '☀️';
  document.getElementById('meta-theme-color').setAttribute('content', theme === 'light' ? '#f8fafc' : '#0f172a');
}

function initTheme() {
  const saved = localStorage.getItem(LS_KEYS.theme);
  const theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(theme);
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    localStorage.setItem(LS_KEYS.theme, next);
    applyTheme(next);
  });
}

// --- wrong-bank / bookmark hooks ---
function onAnswerSubmitted(question, selectedIndex, isCorrect) {
  const wrongBank = loadJSON(LS_KEYS.wrongBank, {});
  if (!isCorrect) {
    const existing = wrongBank[question.id];
    wrongBank[question.id] = {
      question,
      dateAdded: existing ? existing.dateAdded : todayStr(),
      timesWrong: (existing ? existing.timesWrong : 0) + 1,
    };
    saveJSON(LS_KEYS.wrongBank, wrongBank);
  } else if (session.mode === 'review' && wrongBank[question.id]) {
    delete wrongBank[question.id];
    saveJSON(LS_KEYS.wrongBank, wrongBank);
  }
}

function renderQuestionExtras(question) {
  const bookmarks = loadJSON(LS_KEYS.bookmarks, {});
  const active = !!bookmarks[question.id];
  return `<button class="star-btn ${active ? 'active' : ''}" id="btn-star">${active ? '★' : '☆'}</button>`;
}

function attachExtrasHandlers(question) {
  const btn = document.getElementById('btn-star');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const bookmarks = loadJSON(LS_KEYS.bookmarks, {});
    if (bookmarks[question.id]) {
      delete bookmarks[question.id];
    } else {
      bookmarks[question.id] = { question, dateAdded: todayStr() };
    }
    saveJSON(LS_KEYS.bookmarks, bookmarks);
    document.getElementById('extras').innerHTML = renderQuestionExtras(question);
    attachExtrasHandlers(question);
  });
}

// --- app state ---
let session = null; // { mode: 'daily'|'review'|'bookmarks'|'subject', questions, index, progress? }

const app = document.getElementById('app');

function render(html) {
  app.innerHTML = html;
}

// --- in-app back navigation via the History API ---
// This is a client-rendered SPA with no real page navigation, so by default
// a browser/OS back action (swipe-back on mobile, hardware back on Android)
// has no history to act on and closes the app instead of moving between
// in-app screens. Every screen reached from Home (or, for a subject's
// question list, from the Subject Menu) pushes one history entry; every
// on-screen "Home"/"Back" control calls goBack() instead of rendering
// directly, so the visible button and the OS gesture always agree and stay
// in sync automatically.
let screenDepth = 0; // how many screens pushed since Home; lets code that
                      // programmatically returns to Home (not via a click)
                      // unwind exactly that many history entries, so a later
                      // back-press doesn't land on a stale intermediate screen

function pushScreen(screen, params) {
  screenDepth += 1;
  history.pushState({ screen, params: params || null }, '', '#' + screen);
}

function goBack() {
  history.back();
}

function goHomeCollapsingHistory() {
  if (screenDepth > 0) {
    history.go(-screenDepth); // triggers popstate, which lands on 'home'
  } else {
    renderHome();
  }
}

function renderForState(state) {
  session = null;
  if (!state || state.screen === 'home') { renderHome(); return; }
  switch (state.screen) {
    case 'review': startReviewQuiz(false); break;
    case 'bookmarks': startBookmarksQuiz(false); break;
    case 'subjects': renderSubjectMenu(false); break;
    case 'stats': renderStats(false); break;
    case 'subjectList': startSubjectQuiz(state.params.subject, false); break;
    // A mid-quiz question isn't itself reconstructable (which question,
    // which filtered list) from a popped state, and forward-navigating back
    // into one is a rare edge case — fall back to Home, same as what every
    // in-quiz "Home" link already does today.
    default: renderHome();
  }
}

window.addEventListener('popstate', (e) => renderForState(e.state));

async function renderHome() {
  screenDepth = 0;
  const progress = getProgress();
  let dailyLabel = 'Start Daily Quiz';
  let dailySub = '30 new questions';
  if (progress && progress.completed) {
    dailyLabel = 'Retry Daily Quiz';
    dailySub = `Completed today — score ${progress.score}/${progress.total}`;
  } else if (progress && progress.answers.length > 0) {
    dailyLabel = 'Continue Daily Quiz';
    dailySub = `Question ${progress.answers.length + 1} of ${progress.total}`;
  }

  const wrongBank = loadJSON(LS_KEYS.wrongBank, {});
  const bookmarks = loadJSON(LS_KEYS.bookmarks, {});
  const wrongCount = Object.keys(wrongBank).length;
  const bookmarkCount = Object.keys(bookmarks).length;

  render(`
    <h1>USMLE Step 1 Daily Quiz</h1>
    <p class="subtitle">Boards &amp; Beyond — 30 questions a day</p>
    <button class="home-btn" id="btn-daily">
      <div>${dailyLabel}</div>
      <div class="count">${dailySub}</div>
    </button>
    <button class="home-btn" id="btn-review">
      <div>Review Missed</div>
      <div class="count">${wrongCount} question${wrongCount === 1 ? '' : 's'} to review</div>
    </button>
    <button class="home-btn" id="btn-bookmarks">
      <div>Bookmarked</div>
      <div class="count">${bookmarkCount} bookmarked</div>
    </button>
    <button class="home-btn" id="btn-subjects">
      <div>Browse by Subject</div>
      <div class="count">Practice any subject's full archive</div>
    </button>
    <button class="home-btn" id="btn-stats">
      <div>Stats</div>
      <div class="count">Streak, scores, and per-subject breakdown</div>
    </button>
  `);

  document.getElementById('btn-daily').addEventListener('click', startDailyQuiz);
  document.getElementById('btn-review').addEventListener('click', startReviewQuiz);
  document.getElementById('btn-bookmarks').addEventListener('click', startBookmarksQuiz);
  document.getElementById('btn-subjects').addEventListener('click', renderSubjectMenu);
  document.getElementById('btn-stats').addEventListener('click', renderStats);
}

async function startDailyQuiz() {
  pushScreen('quiz');
  let progress = getProgress();
  let data;
  try {
    data = await fetchDailyQuestions();
  } catch (e) {
    render(`<div class="empty-state">Could not load today's questions.<br>${escapeHtml(e.message)}</div>
      <button class="btn-secondary" id="btn-back">Back</button>`);
    document.getElementById('btn-back').addEventListener('click', goBack);
    return;
  }

  if (!progress) {
    if (data.date !== todayStr()) {
      render(`<div class="empty-state">Today's quiz isn't ready yet. Check back soon.</div>
        <button class="btn-secondary" id="btn-back">Back</button>`);
      document.getElementById('btn-back').addEventListener('click', goBack);
      return;
    }
    progress = {
      date: todayStr(),
      subject: data.subject,
      total: data.questions.length,
      answers: [],
      score: 0,
      completed: false,
    };
    saveProgress(progress);
  }

  session = {
    mode: 'daily',
    questions: data.questions,
    index: progress.answers.length,
    progress,
  };

  if (progress.completed) {
    renderSummary();
  } else {
    renderQuestion();
  }
}

function renderQuestion() {
  const q = session.questions[session.index];
  const total = session.questions.length;
  const pct = Math.round((session.index / total) * 100);

  render(`
    <div class="top-bar">
      <button class="back-link" id="btn-home">&larr; Home</button>
      <span id="extras">${renderQuestionExtras(q)}</span>
      <span class="subtitle" style="margin:0;">Q ${session.index + 1} / ${total}</span>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="stem">${escapeHtml(q.stem)}</div>
      <div id="options"></div>
      <div id="explanations"></div>
      <div id="next-holder"></div>
    </div>
  `);

  document.getElementById('btn-home').addEventListener('click', () => { session = null; goBack(); });
  attachExtrasHandlers(q);

  const optionsEl = document.getElementById('options');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
    btn.addEventListener('click', () => selectOption(i));
    optionsEl.appendChild(btn);
  });
}

function selectOption(selectedIndex) {
  const q = session.questions[session.index];
  const isCorrect = selectedIndex === q.correctIndex;
  const optionButtons = document.querySelectorAll('#options .option');

  optionButtons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correctIndex) btn.classList.add('correct');
    if (i === selectedIndex && !isCorrect) btn.classList.add('incorrect');
  });

  const expEl = document.getElementById('explanations');
  q.explanations.forEach((text, i) => {
    const div = document.createElement('div');
    div.className = 'explanation ' + (i === q.correctIndex ? 'correct-exp' : 'incorrect-exp');
    div.textContent = `${String.fromCharCode(65 + i)}. ${text}`;
    expEl.appendChild(div);
  });

  onAnswerSubmitted(q, selectedIndex, isCorrect);

  if (session.mode === 'daily') {
    session.progress.answers.push({ questionId: q.id, selectedIndex, correct: isCorrect });
    if (isCorrect) session.progress.score += 1;
    saveProgress(session.progress);
  }

  const nextHolder = document.getElementById('next-holder');
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn-primary';
  nextBtn.textContent = session.index + 1 < session.questions.length ? 'Next' : 'Finish';
  nextBtn.addEventListener('click', nextQuestion);
  nextHolder.appendChild(nextBtn);
}

function nextQuestion() {
  session.index += 1;
  if (session.index >= session.questions.length) {
    finishSession();
  } else {
    renderQuestion();
  }
}

function finishSession() {
  if (session.mode === 'daily') {
    session.progress.completed = true;
    saveProgress(session.progress);
    addHistoryEntry({
      date: session.progress.date,
      subject: session.progress.subject,
      score: session.progress.score,
      total: session.progress.total,
    });
    renderSummary();
  } else {
    session = null;
    goHomeCollapsingHistory();
  }
}

function renderSummary() {
  const p = session.progress;
  render(`
    <h1>Daily Quiz Complete</h1>
    <div class="card">
      <p>Subject: ${escapeHtml(p.subject)}</p>
      <p>Score: ${p.score} / ${p.total}</p>
    </div>
    <button class="btn-primary" id="btn-home">Back to Home</button>
  `);
  document.getElementById('btn-home').addEventListener('click', () => { session = null; goBack(); });
}

// --- searchable question list (used by Review Missed, Bookmarked, and Browse by Subject) ---
// Assumes the caller has already pushScreen()'d before calling this, so its
// own "Home" link just needs to call goBack() to correctly return to
// whichever screen the caller came from (Home, or the Subject Menu).
function renderQuestionList(questions, opts) {
  if (questions.length === 0) {
    render(`
      <div class="top-bar">
        <button class="back-link" id="btn-home">&larr; Home</button>
        <span class="subtitle" style="margin:0;">${escapeHtml(opts.title)}</span>
      </div>
      <div class="empty-state">${escapeHtml(opts.emptyMessage)}</div>
    `);
    document.getElementById('btn-home').addEventListener('click', goBack);
    return;
  }

  render(`
    <div class="top-bar">
      <button class="back-link" id="btn-home">&larr; Home</button>
      <span class="subtitle" style="margin:0;">${escapeHtml(opts.title)}</span>
    </div>
    <input type="text" id="filter-input" class="filter-input" placeholder="Search questions...">
    <button class="btn-primary" id="btn-start-all"></button>
    <div id="list-items"></div>
  `);
  document.getElementById('btn-home').addEventListener('click', goBack);

  let currentFiltered = questions;

  function startQuizFrom(list, index) {
    pushScreen('quiz');
    session = { mode: opts.mode, questions: list, index };
    renderQuestion();
  }

  document.getElementById('btn-start-all').addEventListener('click', () => {
    startQuizFrom(currentFiltered, 0);
  });

  function renderItems(filterText) {
    const startBtn = document.getElementById('btn-start-all');
    currentFiltered = filterText
      ? questions.filter(q => q.stem.toLowerCase().includes(filterText.toLowerCase()))
      : questions;
    startBtn.textContent = `Start Quiz (${currentFiltered.length})`;
    startBtn.disabled = currentFiltered.length === 0;

    const listEl = document.getElementById('list-items');
    listEl.innerHTML = '';
    currentFiltered.forEach((q, i) => {
      const btn = document.createElement('button');
      btn.className = 'list-item';
      btn.textContent = q.stem.length > 110 ? q.stem.slice(0, 110) + '…' : q.stem;
      btn.addEventListener('click', () => startQuizFrom(currentFiltered, i));
      listEl.appendChild(btn);
    });
  }

  renderItems('');
  document.getElementById('filter-input').addEventListener('input', (e) => renderItems(e.target.value));
}

async function startReviewQuiz(push = true) {
  if (push) pushScreen('review');
  const wrongBank = loadJSON(LS_KEYS.wrongBank, {});
  const questions = Object.values(wrongBank).map(entry => entry.question);
  renderQuestionList(questions, {
    title: 'Review Missed',
    emptyMessage: 'Nothing to review — no wrong answers saved yet.',
    mode: 'review',
  });
}

async function startBookmarksQuiz(push = true) {
  if (push) pushScreen('bookmarks');
  const bookmarks = loadJSON(LS_KEYS.bookmarks, {});
  const questions = Object.values(bookmarks).map(entry => entry.question);
  renderQuestionList(questions, {
    title: 'Bookmarked',
    emptyMessage: 'No bookmarked questions yet.',
    mode: 'bookmarks',
  });
}

// --- Browse by Subject ---
async function renderSubjectMenu(push = true) {
  if (push) pushScreen('subjects');
  let index = {};
  try {
    const res = await fetch(`archive/index.json?v=${Date.now()}`, { cache: 'no-store' });
    if (res.ok) index = await res.json();
  } catch (e) {
    // no archive yet; show all subjects at 0
  }

  const rows = SUBJECTS.map(s => `
    <button class="home-btn subject-row" data-subject="${escapeHtml(s)}">
      <div>${escapeHtml(s)}</div>
      <div class="count">${index[s] || 0} questions archived</div>
    </button>
  `).join('');

  render(`
    <div class="top-bar">
      <button class="back-link" id="btn-home">&larr; Home</button>
      <span class="subtitle" style="margin:0;">Browse by Subject</span>
    </div>
    ${rows}
  `);
  document.getElementById('btn-home').addEventListener('click', goBack);
  document.querySelectorAll('.subject-row').forEach(btn => {
    btn.addEventListener('click', () => startSubjectQuiz(btn.dataset.subject));
  });
}

async function startSubjectQuiz(subject, push = true) {
  if (push) pushScreen('subjectList', { subject });
  let data;
  try {
    const res = await fetch(`archive/${encodeURIComponent(subject)}.json?v=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('not found');
    data = await res.json();
  } catch (e) {
    data = { questions: [] };
  }
  renderQuestionList(data.questions, {
    title: subject,
    emptyMessage: `No archived questions yet for ${subject}.`,
    mode: 'subject',
  });
}

// --- Stats ---
function computeStreak(history) {
  const dateSet = new Set(history.map(h => h.date));
  let streak = 0;
  const cursor = new Date();
  if (!dateSet.has(dateStrFor(cursor))) {
    cursor.setDate(cursor.getDate() - 1);
  }
  while (dateSet.has(dateStrFor(cursor))) {
    streak += 1;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function subjectBreakdown(history) {
  const bySubject = {};
  history.forEach(h => {
    if (!bySubject[h.subject]) bySubject[h.subject] = { score: 0, total: 0 };
    bySubject[h.subject].score += h.score;
    bySubject[h.subject].total += h.total;
  });
  return Object.entries(bySubject)
    .map(([subject, { score, total }]) => ({
      subject, score, total,
      pct: total > 0 ? Math.round((score / total) * 100) : 0,
    }))
    .sort((a, b) => a.pct - b.pct);
}

function renderStats(push = true) {
  if (push) pushScreen('stats');
  const history = getHistory();
  const totalQuizzes = history.length;
  const totalScore = history.reduce((s, h) => s + h.score, 0);
  const totalQuestions = history.reduce((s, h) => s + h.total, 0);
  const avgPct = totalQuestions > 0 ? Math.round((totalScore / totalQuestions) * 100) : 0;
  const streak = computeStreak(history);
  const breakdown = subjectBreakdown(history);

  const breakdownHtml = breakdown.length > 0
    ? breakdown.map(b => `
        <div class="stat-row">
          <span>${escapeHtml(b.subject)}</span>
          <span class="subtitle" style="margin:0;">${b.score}/${b.total} (${b.pct}%)</span>
        </div>
      `).join('')
    : '<p class="subtitle" style="margin:0;">Complete a few daily quizzes to see your breakdown here.</p>';

  render(`
    <div class="top-bar">
      <button class="back-link" id="btn-home">&larr; Home</button>
      <span class="subtitle" style="margin:0;">Stats</span>
    </div>
    <div class="card">
      <div class="stat-row"><span>Current streak</span><span>${streak} day${streak === 1 ? '' : 's'}</span></div>
      <div class="stat-row"><span>Quizzes completed</span><span>${totalQuizzes}</span></div>
      <div class="stat-row"><span>Overall average</span><span>${avgPct}%</span></div>
    </div>
    <h2 class="section-title">By Subject</h2>
    <div class="card">${breakdownHtml}</div>
    <button class="btn-secondary" id="btn-home2">Back to Home</button>
  `);
  document.getElementById('btn-home').addEventListener('click', goBack);
  document.getElementById('btn-home2').addEventListener('click', goBack);
}

initTheme();
history.replaceState({ screen: 'home' }, '', '#home');
renderHome();
</script>
</body>
</html>
