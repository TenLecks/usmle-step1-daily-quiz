<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>USMLE Step 1 Daily Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a855f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Step1 Quiz">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #120e1c; --panel: #1c1730; --panel-2: #241c38; --text: #f5f3fb; --muted: #8b86a3;
    --accent: #a855f7; --accent-2: #f5b942; --correct: #34d399; --incorrect: #f87171; --border: #2d2547;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; }
  #app { max-width: 640px; margin: 0 auto; padding: 20px 20px 44px; }
  h1 { font-family: 'Baloo 2', sans-serif; font-size: 1.35rem; font-weight: 800; margin: 2px 0; }
  .eyebrow { color: var(--muted); font-size: 0.76rem; font-weight: 600; letter-spacing: 0.03em; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }
  .section-label { color: var(--muted); font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; margin: 22px 0 10px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }

  .streak-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2);
    border: 1px solid #3a2f57; border-radius: 999px; padding: 8px 14px; flex-shrink: 0; }
  .streak-pill .num { color: var(--accent-2); font-size: 15px; font-weight: 800; font-family: 'Baloo 2', sans-serif; }

  .hero-card { background: linear-gradient(155deg, #3b2a66, #241a3d); border: 1px solid #4c3a78; border-radius: 22px;
    padding: 20px; display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }

  .week-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 6px; }
  .week-bars { display: flex; align-items: stretch; gap: 8px; height: 52px; }
  .week-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .week-bar-area { flex: 1; width: 100%; display: flex; align-items: flex-end; }
  .week-bar { width: 100%; border-radius: 3px 3px 2px 2px; background: var(--panel-2); }
  .week-bar.has-data { background: linear-gradient(180deg, var(--accent), var(--accent-2)); }
  .week-day-label { color: var(--muted); font-size: 9.5px; font-weight: 700; }

  .tile-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-align: left; color: var(--text);
    font-family: inherit; }
  .tile:active { transform: scale(0.97); }
  .tile-icon { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
  .tile-title { font-size: 14px; font-weight: 700; }
  .tile-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .subject-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  .subject-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px;
    display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; color: var(--text);
    font-family: inherit; width: 100%; }
  .subject-tile:active { transform: scale(0.97); }
  .subject-ring-wrap { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
  .subject-ring-wrap svg.subj-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  .subject-name { font-size: 13px; font-weight: 700; line-height: 1.25; }
  .subject-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .subject-bar-track { width: 100%; height: 3px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .subject-bar-fill { height: 100%; border-radius: 2px; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .top-bar-simple { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .back-link { color: var(--muted); background: none; border: none; cursor: pointer; display: flex; align-items: center; padding: 4px; }
  .star-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--muted); line-height: 1; }
  .star-btn.active { color: var(--accent-2); }

  .progress-bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 3px; transition: width 0.2s; }
  .stem { font-size: 15px; line-height: 1.55; white-space: pre-wrap; }

  .option-row { display: flex; align-items: stretch; gap: 8px; margin-bottom: 8px; }
  .option { flex: 1; text-align: left; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .option.correct { background: rgba(52,211,153,0.14); border-color: var(--correct); font-weight: 700; }
  .option.incorrect { background: rgba(248,113,113,0.14); border-color: var(--incorrect); font-weight: 700; }
  .option:disabled { cursor: default; }
  .option.crossed-out { text-decoration: line-through; opacity: 0.5; }
  .strike-btn { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 38px;
    flex-shrink: 0; color: var(--muted); font-size: 13px; cursor: pointer; }
  .strike-btn.active { color: var(--incorrect); border-color: var(--incorrect); background: rgba(248,113,113,0.12); }
  .strike-btn:disabled { cursor: default; opacity: 0.5; }

  .explanation { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-top: 0; margin-bottom: 8px; font-size: 12.5px; line-height: 1.55; }
  .explanation.correct-exp { border-color: var(--correct); }
  .explanation.incorrect-exp { border-color: var(--incorrect); opacity: 0.85; }

  .overview { background: linear-gradient(155deg, #2a2048, #1c1730); border: 1px solid #4c3a78; border-radius: 16px;
    padding: 16px; margin-top: 6px; }
  .overview-title { font-weight: 800; margin-bottom: 6px; color: var(--accent-2); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 7px; }
  .overview-title svg { flex-shrink: 0; }

  .btn-primary { display: block; width: 100%; padding: 14px; border: none; border-radius: 14px;
    background: var(--accent); color: #1a1024; font-size: 15px; font-weight: 800; font-family: 'Baloo 2', sans-serif;
    cursor: pointer; margin-top: 12px; }
  .btn-secondary { display: block; width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px;
    background: transparent; color: var(--text); font-size: 0.95rem; cursor: pointer; margin-top: 8px; font-family: inherit; }

  .empty-state { color: var(--muted); text-align: center; padding: 32px 16px; }
  .filter-input { display: block; width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel); color: var(--text); font-size: 0.95rem; margin-bottom: 12px; font-family: inherit; }
  .filter-input::placeholder { color: var(--muted); }
  .list-item { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 12px; padding: 11px 13px; margin-bottom: 8px; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
  .list-item:active { border-color: var(--accent); }

  .stat-tiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-bottom: 8px; }
  .stat-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .stat-tile .num { font-family: 'Baloo 2', sans-serif; font-size: 19px; font-weight: 800; color: var(--accent); }
  .stat-tile .label { color: var(--muted); font-size: 9.5px; margin-top: 3px; font-weight: 600; letter-spacing: 0.03em; }

  .bar-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .bar-row:last-child { border-bottom: none; }
  .bar-row .name { flex: 1; font-size: 13.5px; }
  .bar-row .bar-track { width: 60px; height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
  .bar-row .bar-fill { height: 100%; border-radius: 3px; }
  .bar-row .pct { font-size: 12px; font-weight: 700; width: 38px; text-align: right; font-family: 'Baloo 2', sans-serif; flex-shrink: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

const LS_KEYS = {
  progress: 'usmle_progress_v1',
  history: 'usmle_history_v1',
  wrongBank: 'usmle_wrong_bank_v1',
  bookmarks: 'usmle_bookmarks_v1',
};

const SUBJECTS = [
  'Cardiology', 'Dermatology', 'Endocrinology', 'Gastroenterology', 'Genetics',
  'Hematology', 'Immunology', 'Musculoskeletal', 'Neurology', 'Ophthalmology',
  'Pathology', 'Psychiatry', 'Pulmonary', 'Renal', 'Reproductive',
];

// Per-subject accent color + stroke-based icon path (24x24 viewBox), used on
// the home streak/tile icons and the Browse-by-Subject grid.
const SUBJECT_META = {
  'Cardiology': { color: '#fb7185', icon: '<path d="M12 20s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 5c-2.5 4.5-9.5 9-9.5 9Z"/>' },
  'Dermatology': { color: '#fb923c', icon: '<path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 16c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>' },
  'Endocrinology': { color: '#f5b942', icon: '<circle cx="12" cy="12" r="2.4"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(30 12 12)"/>' },
  'Gastroenterology': { color: '#a3e635', icon: '<path d="M8 4c-2 0-3 2-3 4 0 3 2 4 2 7a5 5 0 0 0 10 0c0-2-1-3-1-5a4 4 0 0 0-4-4"/>' },
  'Genetics': { color: '#34d399', icon: '<path d="M7 3c0 6 10 12 10 18M17 3c0 6-10 12-10 18"/><path d="M8 8h8M7.5 12h9M8 16h8"/>' },
  'Hematology': { color: '#2dd4bf', icon: '<path d="M12 3s6 7.5 6 12a6 6 0 0 1-12 0c0-4.5 6-12 6-12Z"/>' },
  'Immunology': { color: '#22d3ee', icon: '<path d="M12 3l7 3v6c0 5-3 8-7 9-4-1-7-4-7-9V6l7-3Z"/>' },
  'Musculoskeletal': { color: '#38bdf8', icon: '<path d="M5 12h14"/><circle cx="5" cy="9" r="2"/><circle cx="5" cy="15" r="2"/><circle cx="19" cy="9" r="2"/><circle cx="19" cy="15" r="2"/>' },
  'Neurology': { color: '#60a5fa', icon: '<circle cx="12" cy="12" r="9"/><path d="M13 6l-4 7h4l-1 5 5-8h-4l1-4Z" fill="#60a5fa" stroke="none"/>' },
  'Ophthalmology': { color: '#818cf8', icon: '<path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.6"/>' },
  'Pathology': { color: '#a78bfa', icon: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="#a78bfa" stroke="none"/>' },
  'Psychiatry': { color: '#c084fc', icon: '<path d="M4 5h16v10H9l-4 4V5Z"/><path d="M8 9h8M8 12h5"/>' },
  'Pulmonary': { color: '#e879f9', icon: '<path d="M12 3v6"/><path d="M12 9c-2-2-6-1-6 3 0 4 2 8 4 8 1.5 0 2-2 2-4"/><path d="M12 9c2-2 6-1 6 3 0 4-2 8-4 8-1.5 0-2-2-2-4"/>' },
  'Renal': { color: '#f472b6', icon: '<path d="M9 4C6 4 4 7 4 11c0 5 3 9 7 9 2 0 3-1.5 3-3.5 0-1.5-1-2-1-3.5s1-2 1-3.5C14 7 12 4 9 4Z"/>' },
  'Reproductive': { color: '#f9a8d4', icon: '<circle cx="9" cy="12" r="5"/><circle cx="17" cy="12" r="3"/>' },
};

const BACK_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c4b8de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
const FLAME_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#f5b942" stroke="none"><path d="M12 2c-.3 3-1.6 4.8-3.6 6.4C6.2 10 5 12 5 14.5A7 7 0 0 0 19 14.5c0-2-1-3.6-2.3-4.8.8 2-.4 3.3-.4 3.3s.6-3.3-1.4-5.4C13.3 5.8 12.3 4.2 12 2Z"/></svg>';
const REVIEW_ICON = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5"/><path d="M20 12a8 8 0 0 1-14 5"/><path d="M18 4v4h-4"/><path d="M6 20v-4h4"/></svg>';
const BOOKMARK_ICON = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#f5b942" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6L12 3Z"/></svg>';
const GRID_ICON = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';
const STATS_ICON = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>';
const SPARKLE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f5b942" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9"/></svg>';

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function dateStrFor(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function todayStr() {
  return dateStrFor(new Date());
}

async function fetchDailyQuestions() {
  const res = await fetch(`questions.json?v=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Failed to load questions.json: ${res.status}`);
  return res.json();
}

function getProgress() {
  const p = loadJSON(LS_KEYS.progress, null);
  if (p && p.date === todayStr()) return p;
  return null;
}

function saveProgress(progress) {
  saveJSON(LS_KEYS.progress, progress);
}

function getHistory() {
  return loadJSON(LS_KEYS.history, []);
}

function addHistoryEntry(entry) {
  const history = getHistory();
  history.push(entry);
  saveJSON(LS_KEYS.history, history.slice(-365));
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- wrong-bank / bookmark hooks ---
function onAnswerSubmitted(question, selectedIndex, isCorrect) {
  const wrongBank = loadJSON(LS_KEYS.wrongBank, {});
  if (!isCorrect) {
    const existing = wrongBank[question.id];
    wrongBank[question.id] = {
      question,
      dateAdded: existing ? existing.dateAdded : todayStr(),
      timesWrong: (existing ? existing.timesWrong : 0) + 1,
    };
    saveJSON(LS_KEYS.wrongBank, wrongBank);
  } else if (session.mode === 'review' && wrongBank[question.id]) {
    delete wrongBank[question.id];
    saveJSON(LS_KEYS.wrongBank, wrongBank);
  }
}

function renderQuestionExtras(question) {
  const bookmarks = loadJSON(LS_KEYS.bookmarks, {});
  const active = !!bookmarks[question.id];
  return `<button class="star-btn ${active ? 'active' : ''}" id="btn-star">${active ? '★' : '☆'}</button>`;
}

function attachExtrasHandlers(question) {
  const btn = document.getElementById('btn-star');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const bookmarks = loadJSON(LS_KEYS.bookmarks, {});
    if (bookmarks[question.id]) {
      delete bookmarks[question.id];
    } else {
      bookmarks[question.id] = { question, dateAdded: todayStr() };
    }
    saveJSON(LS_KEYS.bookmarks, bookmarks);
    document.getElementById('extras').innerHTML = renderQuestionExtras(question);
    attachExtrasHandlers(question);
  });
}

// --- app state ---
let session = null; // { mode: 'daily'|'review'|'bookmarks'|'subject', questions, index, progress? }

const app = document.getElementById('app');

function render(html) {
  app.innerHTML = html;
}

// --- in-app back navigation via the History API ---
// This is a client-rendered SPA with no real page navigation, so by default
// a browser/OS back action (swipe-back on mobile, hardware back on Android)
// has no history to act on and closes the app instead of moving between
// in-app screens. Every screen reached from Home (or, for a subject's
// question list, from the Subject Menu) pushes one history entry; every
// on-screen "Home"/"Back" control calls goBack() instead of rendering
// directly, so the visible button and the OS gesture always agree and stay
// in sync automatically.
let screenDepth = 0; // how many screens pushed since Home; lets code that
                      // programmatically returns to Home (not via a click)
                      // unwind exactly that many history entries, so a later
                      // back-press doesn't land on a stale intermediate screen

function pushScreen(screen, params) {
  screenDepth += 1;
  history.pushState({ screen, params: params || null }, '', '#' + screen);
}

function goBack() {
  history.back();
}

function goHomeCollapsingHistory() {
  if (screenDepth > 0) {
    history.go(-screenDepth); // triggers popstate, which lands on 'home'
  } else {
    renderHome();
  }
}

function renderForState(state) {
  session = null;
  if (!state || state.screen === 'home') { renderHome(); return; }
  switch (state.screen) {
    case 'review': startReviewQuiz(false); break;
    case 'bookmarks': startBookmarksQuiz(false); break;
    case 'subjects': renderSubjectMenu(false); break;
    case 'stats': renderStats(false); break;
    case 'subjectList': renderSubjectBatches(state.params.subject, false); break;
    case 'subjectBatch': startSubjectBatchQuiz(state.params.subject, state.params.date, false); break;
    case 'subjectMissed': startSubjectMissedQuiz(state.params.subject, false); break;
    // A mid-quiz question isn't itself reconstructable (which question,
    // which filtered list) from a popped state, and forward-navigating back
    // into one is a rare edge case — fall back to Home, same as what every
    // in-quiz "Home" link already does today.
    default: renderHome();
  }
}

window.addEventListener('popstate', (e) => renderForState(e.state));

// --- decorative SVG helpers ---
function heroRingSvg(pct) {
  const r = 40, c = 2 * Math.PI * r;
  const offset = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return `
    <svg width="80" height="80" viewBox="0 0 100 100" style="flex-shrink:0;">
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="#241c38" stroke-width="10"/>
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="#a855f7" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 50 50)"/>
      <text x="50" y="47" text-anchor="middle" fill="#f5f3fb" font-size="20" font-weight="800" font-family="'Baloo 2',sans-serif">${pct}%</text>
      <text x="50" y="65" text-anchor="middle" fill="#8b86a3" font-size="11" font-family="Manrope,sans-serif">today</text>
    </svg>`;
}

function subjectRingSvg(pct, color) {
  const r = 19, c = 2 * Math.PI * r;
  const known = pct !== null;
  const offset = c * (1 - (known ? pct : 0) / 100);
  return `
    <svg width="44" height="44" viewBox="0 0 44 44">
      <circle cx="22" cy="22" r="${r}" fill="none" stroke="${color}" stroke-opacity="0.22" stroke-width="4"/>
      <circle cx="22" cy="22" r="${r}" fill="none" stroke="${known ? color : '#3a3552'}" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 22 22)"/>
    </svg>`;
}

// last 7 calendar days' accuracy, oldest first; pct is null for a day with
// no completed quiz (rendered as a muted sliver rather than a 0% bar, so
// "didn't practice" and "practiced and got 0" stay visually distinct)
function weeklyActivity(history) {
  const byDate = {};
  history.forEach(h => {
    if (!byDate[h.date]) byDate[h.date] = { score: 0, total: 0 };
    byDate[h.date].score += h.score;
    byDate[h.date].total += h.total;
  });
  const days = [];
  const cursor = new Date();
  cursor.setDate(cursor.getDate() - 6);
  for (let i = 0; i < 7; i++) {
    const ds = dateStrFor(cursor);
    const rec = byDate[ds];
    days.push({
      date: ds,
      label: cursor.toLocaleDateString('en-US', { weekday: 'narrow' }),
      pct: rec && rec.total > 0 ? Math.round((rec.score / rec.total) * 100) : null,
    });
    cursor.setDate(cursor.getDate() + 1);
  }
  return days;
}

async function renderHome() {
  screenDepth = 0;
  const progress = getProgress();
  const history = getHistory();
  const streak = computeStreak(history);

  let heroLabel = 'Start Daily Quiz';
  let heroPct = 0;

    heroLabel = 'Retry Daily Quiz';

  const bookmarks = loadJSON(LS_KEYS.bookmarks, {});

  const bookmarkCount = Object.keys(bookmarks).length;
  const totalQuestions = history.reduce((s, h) => s + h.total, 0);

  render(`
    <div class="top-bar" style="margin-bottom:6px;">
      <div>
        <div class="eyebrow">Boards &amp; Beyond</div>
        <h1>Step 1 Daily</h1>
      </div>
      <div class="streak-pill">${FLAME_ICON}<span class="num">${streak}</span></div>
    </div>

    <div class="hero-card">
      ${heroRingSvg(heroPct)}
      <div style="display:flex; flex-direction:column; gap:10px; flex:1; min-width:0;">
        <div>
          <div class="eyebrow">${escapeHtml(heroSubjectLabel)}</div>
          <div style="font-size:14.5px; color:#d8cff0; margin-top:2px;">${escapeHtml(heroFraction)}</div>
        </div>

    </div>

    <div class="section-label">Keep going</div>
    <div class="tile-grid">

        <div><div class="tile-title">Bookmarked</div><div class="tile-sub">${bookmarkCount} saved</div></div>
      </button>
      <button class="tile" id="btn-subjects">
        <div class="tile-icon" style="background:rgba(168,85,247,0.16);">${GRID_ICON}</div>
        <div><div class="tile-title">Subjects</div><div class="tile-sub">Browse all ${SUBJECTS.length}</div></div>
      </button>

async function startDailyQuiz() {
  pushScreen('quiz');
  let progress = getProgress();
  let data;
  try {
    data = await fetchDailyQuestions();
  } catch (e) {
    render(`<div class="empty-state">Could not load today's questions.<br>${escapeHtml(e.message)}</div>
      <button class="btn-secondary" id="btn-back">Back</button>`);
    document.getElementById('btn-back').addEventListener('click', goBack);
    return;
  }

  if (!progress) {
    if (data.date !== todayStr()) {
      render(`<div class="empty-state">Today's quiz isn't ready yet. Check back soon.</div>
        <button class="btn-secondary" id="btn-back">Back</button>`);
      document.getElementById('btn-back').addEventListener('click', goBack);
      return;
    }
    progress = {
      date: todayStr(),
      subject: data.subject,
      total: data.questions.length,
      answers: [],
      score: 0,
      completed: false,
    };
    saveProgress(progress);
  }

  session = {
    mode: 'daily',
    questions: data.questions,
    index: progress.answers.length,
    progress,
  };

  if (progress.completed) {
    renderSummary();
  } else {
    renderQuestion();
  }
}

function renderQuestion() {
  const q = session.questions[session.index];
  const total = session.questions.length;
  const pct = Math.round((session.index / total) * 100);

  render(`
    <div class="top-bar">
      <button class="back-link" id="btn-home">${BACK_ICON}</button>
      <span id="extras">${renderQuestionExtras(q)}</span>
      <span class="eyebrow" style="font-size:13px;">Q ${session.index + 1} / ${total}</span>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="stem">${escapeHtml(q.stem)}</div>
    </div>
    <div id="options"></div>
    <div id="explanations"></div>
    <div id="next-holder"></div>
  `);

  document.getElementById('btn-home').addEventListener('click', () => { session = null; goBack(); });
  attachExtrasHandlers(q);

  const optionsEl = document.getElementById('options');
  q.options.forEach((opt, i) => {
    const row = document.createElement('div');
    row.className = 'option-row';

    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
    btn.addEventListener('click', () => selectOption(i));

    // Cross-out is a scratch aid only (like UWorld's strike-through) — it
    // never selects an answer, just toggles a visual line-through so the
    // option can still be tapped normally if the user changes their mind.
    const strikeBtn = document.createElement('button');
    strikeBtn.className = 'strike-btn';
    strikeBtn.setAttribute('aria-label', 'Cross out this option');
    strikeBtn.textContent = '✕';
    strikeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      btn.classList.toggle('crossed-out');
      strikeBtn.classList.toggle('active');
    });

    row.appendChild(btn);
    row.appendChild(strikeBtn);
    optionsEl.appendChild(row);
  });
}

function selectOption(selectedIndex) {
  const q = session.questions[session.index];
  const isCorrect = selectedIndex === q.correctIndex;
  const optionButtons = document.querySelectorAll('#options .option');

  optionButtons.forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('crossed-out');
    if (i === q.correctIndex) btn.classList.add('correct');
    if (i === selectedIndex && !isCorrect) btn.classList.add('incorrect');
  });
  document.querySelectorAll('#options .strike-btn').forEach(btn => { btn.disabled = true; });

  const expEl = document.getElementById('explanations');
  q.explanations.forEach((text, i) => {
    const isCorrectExp = i === q.correctIndex;
    const div = document.createElement('div');
    div.className = 'explanation ' + (isCorrectExp ? 'correct-exp' : 'incorrect-exp');
    const letter = document.createElement('b');
    letter.style.color = isCorrectExp ? 'var(--correct)' : 'var(--incorrect)';
    letter.textContent = `${String.fromCharCode(65 + i)} · `;
    div.appendChild(letter);
    div.appendChild(document.createTextNode(text));
    expEl.appendChild(div);
  });

  // Older archived questions (generated before this field existed) won't
  // have q.overview — skip the block rather than rendering it empty.
  if (q.overview) {
    const overviewDiv = document.createElement('div');
    overviewDiv.className = 'overview';
    const titleDiv = document.createElement('div');
    titleDiv.className = 'overview-title';
    titleDiv.innerHTML = SPARKLE_ICON + '<span>High-Yield Overview</span>';
    overviewDiv.appendChild(titleDiv);
    const overviewText = document.createElement('div');
    overviewText.textContent = q.overview;
    overviewDiv.appendChild(overviewText);
    expEl.appendChild(overviewDiv);
  }

  onAnswerSubmitted(q, selectedIndex, isCorrect);

  if (session.mode === 'daily') {
    session.progress.answers.push({ questionId: q.id, selectedIndex, correct: isCorrect });
    if (isCorrect) session.progress.score += 1;
    saveProgress(session.progress);
  }

  const nextHolder = document.getElementById('next-holder');
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn-primary';
  nextBtn.textContent = session.index + 1 < session.questions.length ? 'Next' : 'Finish';
  nextBtn.addEventListener('click', nextQuestion);
  nextHolder.appendChild(nextBtn);
}

function nextQuestion() {
  session.index += 1;
  if (session.index >= session.questions.length) {
    finishSession();
  } else {
    renderQuestion();
  }
}

function finishSession() {
  if (session.mode === 'daily') {
    session.progress.completed = true;
    saveProgress(session.progress);
    addHistoryEntry({
      date: session.progress.date,
      subject: session.progress.subject,
      score: session.progress.score,
      total: session.progress.total,
    });
    renderSummary();
  } else {
    session = null;
    goHomeCollapsingHistory();
  }
}

function renderSummary() {
  const p = session.progress;
  const pct = p.total > 0 ? Math.round((p.score / p.total) * 100) : 0;
  render(`
    <h1>Quiz Complete!</h1>
    <p class="subtitle">${escapeHtml(p.subject)}</p>
    <div class="card" style="text-align:center; padding:28px;">
      <div style="font-family:'Baloo 2',sans-serif; font-size:40px; font-weight:800; color:var(--accent);">${p.score}<span style="color:var(--muted); font-size:22px;">/${p.total}</span></div>
      <div style="color:var(--muted); font-size:13px; margin-top:6px;">${pct}% correct</div>
    </div>
    <button class="btn-primary" id="btn-home">Back to Home</button>
  `);
  document.getElementById('btn-home').addEventListener('click', () => { session = null; goBack(); });
}

// --- searchable question list (used by Review Missed, Bookmarked, and Browse by Subject) ---
// Assumes the caller has already pushScreen()'d before calling this, so its
// own "Home" link just needs to call goBack() to correctly return to
// whichever screen the caller came from (Home, or the Subject Menu).
function renderQuestionList(questions, opts) {
  if (questions.length === 0) {
    render(`
      <div class="top-bar-simple">
        <button class="back-link" id="btn-home">${BACK_ICON}</button>
        <h1 style="margin:0;">${escapeHtml(opts.title)}</h1>
      </div>
      <div class="empty-state">${escapeHtml(opts.emptyMessage)}</div>
    `);
    document.getElementById('btn-home').addEventListener('click', goBack);
    return;
  }

  render(`
    <div class="top-bar-simple">
      <button class="back-link" id="btn-home">${BACK_ICON}</button>
      <h1 style="margin:0;">${escapeHtml(opts.title)}</h1>
    </div>
    <input type="text" id="filter-input" class="filter-input" placeholder="Search questions...">
    <button class="btn-primary" id="btn-start-all" style="margin-top:0; margin-bottom:16px;"></button>
    <div id="list-items"></div>
  `);
  document.getElementById('btn-home').addEventListener('click', goBack);

  let currentFiltered = questions;

  function startQuizFrom(list, index) {
    pushScreen('quiz');
    session = { mode: opts.mode, questions: list, index };
    renderQuestion();
  }

  document.getElementById('btn-start-all').addEventListener('click', () => {
    startQuizFrom(currentFiltered, 0);
  });

  function renderItems(filterText) {
    const startBtn = document.getElementById('btn-start-all');
    currentFiltered = filterText
      ? questions.filter(q => q.stem.toLowerCase().includes(filterText.toLowerCase()))
      : questions;
    startBtn.textContent = `Start Quiz (${currentFiltered.length})`;
    startBtn.disabled = currentFiltered.length === 0;

    const listEl = document.getElementById('list-items');
    listEl.innerHTML = '';
    currentFiltered.forEach((q, i) => {
      const btn = document.createElement('button');
      btn.className = 'list-item';
      btn.textContent = q.stem.length > 110 ? q.stem.slice(0, 110) + '…' : q.stem;
      btn.addEventListener('click', () => startQuizFrom(currentFiltered, i));
      listEl.appendChild(btn);
    });
  }

  renderItems('');
  document.getElementById('filter-input').addEventListener('input', (e) => renderItems(e.target.value));
}

  if (push) pushScreen('review');

// --- Browse by Subject ---
async function renderSubjectMenu(push = true) {
  if (push) pushScreen('subjects');
  let index = {};

    const res = await fetch(`archive/index.json?v=${Date.now()}`, { cache: 'no-store' });
    if (res.ok) index = await res.json();
  } catch (e) {
    // no archive yet; show all subjects at 0
  }

  subjectBreakdown(getHistory()).forEach(b => { accuracyBySubject[b.subject] = b.pct; });

  const tiles = SUBJECTS.map(s => {
    const meta = SUBJECT_META[s];
    const count = index[s] || 0;

    const sub = hasData ? `${count} Qs &middot; ${pct}%` : `${count} Qs &middot; not started`;
    return `
      <button class="subject-tile" data-subject="${escapeHtml(s)}">
        <div class="subject-ring-wrap">

        </div>

  render(`
    <div class="top-bar-simple">

async function fetchSubjectQuestions(subject) {
  try {
    const res = await fetch(`archive/${encodeURIComponent(subject)}.json?v=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    return data.questions || [];
  } catch (e) {
    return [];
  }
}

// Question ids are "{generation-date}-{NN}" (see generate.py) — the date is
// reused here as a free grouping key, so a subject's growing archive reads
// as a list of quizzes instead of one ever-longer flat list.
function batchDateFromId(id) {
  const m = /^(\d{4}-\d{2}-\d{2})-\d+$/.exec(id);
  return m ? m[1] : 'unknown';
}

function groupIntoBatches(questions) {
  const byDate = {};
  questions.forEach(q => {
    const date = batchDateFromId(q.id);
    (byDate[date] = byDate[date] || []).push(q);
  });
  return Object.entries(byDate)
    .map(([date, qs]) => ({ date, questions: qs }))
    .sort((a, b) => b.date.localeCompare(a.date)); // newest quiz first
}

function formatBatchDate(dateStr) {
  if (dateStr === 'unknown') return 'Unknown date';
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

async function renderSubjectBatches(subject, push = true) {
  if (push) pushScreen('subjectList', { subject });
  const questions = await fetchSubjectQuestions(subject);

  if (questions.length === 0) {
    render(`
      <div class="top-bar-simple">
        <button class="back-link" id="btn-home">${BACK_ICON}</button>
        <h1 style="margin:0;">${escapeHtml(subject)}</h1>
      </div>
      <div class="empty-state">No archived questions yet for ${escapeHtml(subject)}.</div>
    `);
    document.getElementById('btn-home').addEventListener('click', goBack);
    return;
  }

  const subjectIds = new Set(questions.map(q => q.id));
  const wrongBank = loadJSON(LS_KEYS.wrongBank, {});
  const missedCount = Object.keys(wrongBank).filter(id => subjectIds.has(id)).length;

  const batches = groupIntoBatches(questions);
  const batchRows = batches.map(b => `
    <button class="list-item batch-row" data-date="${escapeHtml(b.date)}">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span>${escapeHtml(formatBatchDate(b.date))}</span>
        <span style="color:var(--muted); font-size:12px;">${b.questions.length} questions</span>
      </div>
    </button>
  `).join('');

  render(`
    <div class="top-bar-simple">
      <button class="back-link" id="btn-home">${BACK_ICON}</button>
      <h1 style="margin:0;">${escapeHtml(subject)}</h1>
    </div>
    <button class="tile" id="btn-subject-missed" style="width:100%; flex-direction:row; align-items:center; margin-bottom:20px; ${missedCount === 0 ? 'opacity:0.5; cursor:default;' : ''}">
      <div class="tile-icon" style="background:rgba(248,113,113,0.16); flex-shrink:0;">${REVIEW_ICON}</div>
      <div style="text-align:left;"><div class="tile-title">Missed in ${escapeHtml(subject)}</div><div class="tile-sub">${missedCount} question${missedCount === 1 ? '' : 's'}</div></div>
    </button>
    <div class="section-label">Quizzes</div>
    ${batchRows}
  `);
  document.getElementById('btn-home').addEventListener('click', goBack);
  if (missedCount > 0) {
    document.getElementById('btn-subject-missed').addEventListener('click', () => startSubjectMissedQuiz(subject));
  }
  document.querySelectorAll('.batch-row').forEach(btn => {
    btn.addEventListener('click', () => startSubjectBatchQuiz(subject, btn.dataset.date));
  });
}

async function startSubjectBatchQuiz(subject, date, push = true) {
  if (push) pushScreen('subjectBatch', { subject, date });
  const questions = await fetchSubjectQuestions(subject);
  const batchQuestions = questions.filter(q => batchDateFromId(q.id) === date);
  renderQuestionList(batchQuestions, {
    title: `${subject} · ${formatBatchDate(date)}`,
    emptyMessage: 'No questions found for this quiz.',
    mode: 'subject',
  });
}

async function startSubjectMissedQuiz(subject, push = true) {
  if (push) pushScreen('subjectMissed', { subject });
  const questions = await fetchSubjectQuestions(subject);
  const subjectIds = new Set(questions.map(q => q.id));
  const wrongBank = loadJSON(LS_KEYS.wrongBank, {});
  const missed = Object.values(wrongBank)
    .filter(entry => subjectIds.has(entry.question.id))
    .map(entry => entry.question);
  renderQuestionList(missed, {
    title: `${subject} · Missed`,
    emptyMessage: `Nothing missed in ${subject} yet.`,
    // 'review' mode so answering correctly here also clears it from the
    // global wrong-bank, same as the main Review Missed flow.
    mode: 'review',
  });
}

// --- Stats ---
function computeStreak(history) {
  const dateSet = new Set(history.map(h => h.date));
  let streak = 0;
  const cursor = new Date();
  if (!dateSet.has(dateStrFor(cursor))) {
    cursor.setDate(cursor.getDate() - 1);
  }
  while (dateSet.has(dateStrFor(cursor))) {
    streak += 1;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function subjectBreakdown(history) {
  const bySubject = {};
  history.forEach(h => {
    if (!bySubject[h.subject]) bySubject[h.subject] = { score: 0, total: 0 };
    bySubject[h.subject].score += h.score;
    bySubject[h.subject].total += h.total;
  });
  return Object.entries(bySubject)
    .map(([subject, { score, total }]) => ({
      subject, score, total,
      pct: total > 0 ? Math.round((score / total) * 100) : 0,
    }))
    .sort((a, b) => a.pct - b.pct);
}

function tierColor(pct) {
  if (pct >= 80) return '#34d399';
  if (pct >= 50) return '#f5b942';
  return '#f87171';
}

function renderStats(push = true) {
  if (push) pushScreen('stats');
  const history = getHistory();
  const totalQuizzes = history.length;
  const totalScore = history.reduce((s, h) => s + h.score, 0);
  const totalQuestions = history.reduce((s, h) => s + h.total, 0);
  const avgPct = totalQuestions > 0 ? Math.round((totalScore / totalQuestions) * 100) : 0;
  const streak = computeStreak(history);
  const breakdown = subjectBreakdown(history);

  const breakdownHtml = breakdown.length > 0
    ? breakdown.map(b => `
        <div class="bar-row">
          <span class="name">${escapeHtml(b.subject)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${b.pct}%; background:${tierColor(b.pct)};"></div></div>
          <span class="pct" style="color:${tierColor(b.pct)};">${b.pct}%</span>
        </div>
      `).join('')
    : '<p class="subtitle" style="margin:0;">Complete a few daily quizzes to see your breakdown here.</p>';

  render(`
    <div class="top-bar-simple">
      <button class="back-link" id="btn-home">${BACK_ICON}</button>
      <h1 style="margin:0;">Stats</h1>
    </div>
    <div class="stat-tiles">
      <div class="stat-tile"><div class="num">${streak}</div><div class="label">DAY STREAK</div></div>
      <div class="stat-tile"><div class="num">${totalQuizzes}</div><div class="label">QUIZZES</div></div>
      <div class="stat-tile"><div class="num">${avgPct}%</div><div class="label">AVG SCORE</div></div>
    </div>
    <div class="section-label">By Subject</div>
    <div class="card">${breakdownHtml}</div>
    <button class="btn-secondary" id="btn-home2">Back to Home</button>
  `);
  document.getElementById('btn-home').addEventListener('click', goBack);
  document.getElementById('btn-home2').addEventListener('click', goBack);
}

history.replaceState({ screen: 'home' }, '', '#home');
renderHome();
</script>
